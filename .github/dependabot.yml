version: 2
updates:
    - package-ecosystem: "gomod"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "06:00"
          timezone: "Europe/Moscow"

      open-pull-requests-limit: 3

      labels:
          - "dependencies"
          - "go"

      commit-message:
          prefix: "chore(deps)"

      groups:
          go-dependencies:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"

      open-pull-requests-limit: 2

      labels:
          - "dependencies"
          - "ci"

      commit-message:
          prefix: "chore(ci)"
